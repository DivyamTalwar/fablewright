name: Bug report
description: Something behaved differently from what the docs promise
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If a lane was refused, that may be correct behaviour — FABLEWRIGHT stops a lane
        rather than returning work it could not verify. Paste the exact refusal so we can
        tell a working guarantee from a broken one.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Exact command and its exact output. Redact paths and ids if you need to.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and where the docs say so
      description: Quote the line from the README or a reference file, if there is one.
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: [Claude Code, OpenAI Codex, Both, Neither - scripts only]
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: Gate output
      description: "Output of `sh tests/run-tests.sh` and `sh scripts/verify.sh`. Both are offline."
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`claude --version`, `codex --version`, `jq --version`, and your OS."
    validations:
      required: true
