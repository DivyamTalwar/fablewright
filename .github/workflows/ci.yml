name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install dependencies
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq shellcheck
          else
            brew install jq shellcheck
          fi
          jq --version
          shellcheck --version

      - name: Confirm no model CLI is present
        run: |
          ! command -v codex  || { echo "codex unexpectedly on PATH"; exit 1; }
          ! command -v claude || { echo "claude unexpectedly on PATH"; exit 1; }
          echo "clean runner confirmed"

      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/*.sh tests/*.sh

      - name: Behavioural test suite
        run: sh tests/run-tests.sh

      - name: Release verification
        run: sh scripts/verify.sh
